name: Spell check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readme:
    name: Spell-check README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aspell
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-en
      - name: Check README.md
        run: |
          words=$(aspell list --lang=en < README.md | sort -u)
          if [ -n "$words" ]; then
            echo "Misspelled words in README.md:"
            echo "$words"
            exit 1
          fi
          echo "No misspelled words in README.md."
